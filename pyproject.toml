[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbia"
version = "2.6.0"
description = "Hub da Bia - Suíte Pessoal de Produtividade e Ferramentas"
readme = "README.md"
authors = [{name = "BiaStudio"}]
license = {text = "Proprietario"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "packaging>=23.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
hubbia = "hubbia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hubbia*"]

[tool.setuptools.package-data]
hubbia = ["assets/**/*", "config/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]